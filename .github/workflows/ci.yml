name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@7b32292d2be353574bb575524c3129e094ed1104 # v0.6.177
        with:
          tools: just@1.59.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.5'
          enable-cache: 'true'
          cache-dependency-glob: 'uv.lock'
          # Only trusted main runs write the cache; pruning keeps source-built wheels only.
          save-cache: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          prune-cache: 'true'
      - name: Ruff, mypy and pytest in the locked environment
        run: |
          just setup-backend
          just check-backend
          just test

  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@7b32292d2be353574bb575524c3129e094ed1104 # v0.6.177
        with:
          tools: just@1.59.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-cache@7b32292d2be353574bb575524c3129e094ed1104 # v0.6.177
      - name: Typecheck and build
        run: |
          just setup-frontend
          just check-frontend
          just build

  semgrep:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@7b32292d2be353574bb575524c3129e094ed1104 # v0.6.177
        with:
          tools: just@1.59.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.5'
          enable-cache: 'true'
          cache-dependency-glob: 'uv.lock'
          # Only trusted main runs write the cache; pruning keeps source-built wheels only.
          save-cache: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          prune-cache: 'true'
      - name: Semgrep CI rules
        run: just scan

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@7b32292d2be353574bb575524c3129e094ed1104 # v0.6.177
        with:
          tools: zizmor@1.32.0,just@1.59.0
      - name: Install actionlint 1.7.12 and gitleaks 8.30.1, checked against their digests
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"; mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$bin" "actionlint"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$bin" "gitleaks"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Check workflows and the retained history
        run: just check-workflows

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@7b32292d2be353574bb575524c3129e094ed1104 # v0.6.177
    permissions:
      contents: read

  gate:
    needs: [backend, frontend, workflows, semgrep, dependency-review, merge-stops]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every required job ended as expected
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"backend":"success","frontend":"success","workflows":"success","semgrep":"success",
            "dependency-review":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
